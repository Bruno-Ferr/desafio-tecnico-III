<form
  titulo="Dados do Exame"
  [formGroup]="examForm" 
  (onSubmit)="onSubmit()">

  <h2>Dados do Exame</h2>

  <app-custom-input
    label="ID do Paciente"
    [form]="examForm"
    controlName="patientId"
    [readonly]="true">
  </app-custom-input>

  <app-custom-input
    label="modalidade"
    [form]="examForm"
    controlName="modality">
  </app-custom-input>
  
  <div class="form-actions">
    <button type="submit" [disabled]="examForm.invalid">
      Salvar
    </button>
  </div>
</form>
