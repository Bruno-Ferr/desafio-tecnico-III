<form
  titulo="Dados do Exame"
  [formGroup]="examForm" 
  (ngSubmit)="onSubmit()">

  <h2>Dados do Exame</h2>

  <app-custom-input
    label="ID do Paciente"
    [form]="examForm"
    controlName="patientId"
    [readonly]="true">
  </app-custom-input>

  <app-custom-select
    label="Modalidade"
    [form]="examForm"
    controlName="modality"
    [options]="modalityOptions"
    placeholder="Selecione a modalidade">
  </app-custom-select>
  
  <div class="form-actions">
    <button type="submit" [disabled]="examForm.invalid">
      Salvar
    </button>
  </div>
</form>
