<div class="container">
  <button class="backButton" (click)="voltar()">Voltar</button>
  
  <!-- Informações do Paciente -->
  @if (patientInfo) {
    <div class="patient-info">
      <h2>{{ patientInfo.name }}</h2>
      <div class="patient-details">
        <span><strong>CPF:</strong> {{ patientInfo.cpf }}</span>
        <span><strong>Idade:</strong> {{ patientInfo.age }} anos</span>
      </div>
    </div>
  }
  
  <div class="header">
    <h1>Lista de exames</h1>
  
    <button mat-raised-button color="primary" (click)="openNewExamDialog()">
      Novo Exame
    </button>
  </div>

  <app-list-component 
    [items]="exams" 
    [listType]="'exams'" 
    [isLoading]="isLoading"
    [currentPage]="currentPage"
    [totalItems]="totalItems"
    [itemsPerPage]="itemsPerPage"
    (pageChange)="handlePageEvent($event)"
  >
    <ng-template let-exam>
      <div class="exam-card">
        <strong>{{ exam.title }}</strong>
        <p>{{ exam.date }}</p>
      </div>
    </ng-template>
  </app-list-component>
</div>
