<form
  titulo="Dados do Paciente"
  [formGroup]="patienteForm" 
  (onSubmit)="onSubmit()">

  <h2>Dados do Paciente</h2>

  <app-custom-input
    label="Nome"
    [form]="patienteForm"
    controlName="nome">
  </app-custom-input>

  <app-custom-input
    label="CPF"
    [form]="patienteForm"
    controlName="cpf">
  </app-custom-input>

  <app-custom-input
    label="idade"
    [form]="patienteForm"
    controlName="idade">
  </app-custom-input>
  
  <div class="form-actions">
    <button type="button" (click)="onCancel()">Cancelar</button>
    <button type="submit" [disabled]="patienteForm.invalid">
      Salvar
    </button>
  </div>
</form>
