<div class="container">
  <div class="header">
    <h1>Lista de Pacientes</h1>
    <button mat-raised-button color="primary" (click)="openNewPatientDialog()">
      Novo Paciente
    </button>
  </div>

  <app-list-component 
    [items]="paginatedItems" 
    [listType]="listType" 
    [isLoading]="isLoading"
    [currentPage]="currentPage"
    [totalItems]="totalItems"
    [itemsPerPage]="itemsPerPage"
    (pageChange)="handlePageEvent($event)"
  >
    <ng-template let-patient>
      <a class="patient-card" [routerLink]="['/exames', patient.id]" [state]="{ patient: patient }">
        <p><strong>{{ patient.name }}</strong> - {{ patient.age }}</p>
      </a>
    </ng-template>
  </app-list-component>
</div>
